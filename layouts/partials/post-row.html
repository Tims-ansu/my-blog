<article class="post-row">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02, 2006" }}</time>
  <div><p class="post-category">{{ .Params.category | default "Notes" }}{{ if .Params.sample }} <span> / Sample post</span>{{ end }}</p><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p class="post-description">{{ .Description }}</p><span class="reading-time">{{ .ReadingTime }} min read</span></div>
  <a class="post-arrow" href="{{ .RelPermalink }}" aria-label="Read {{ .Title }}">↗</a>
</article>
