<div class="course-grid">
  {{ range .Sections.ByWeight }}
  <a class="course-card" href="{{ .RelPermalink }}">
    <span class="course-code">{{ .Params.code }}</span>
    <h3>{{ .Title }}</h3>
    <span class="course-card-footer"><span>{{ len .RegularPagesRecursive }} {{ if eq (len .RegularPagesRecursive) 1 }}post{{ else }}posts{{ end }}</span><span aria-hidden="true">↗</span></span>
  </a>
  {{ end }}
</div>
