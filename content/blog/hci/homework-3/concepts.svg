<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img"><title>Three concepts for AR assistance</title><rect width="1080" height="460" fill="#f6f4ec"/><style>text{font-family:Arial,sans-serif;fill:#24342c}.title{font-size:22px}.label{font-size:16px}.small{font-size:14px}.scene{fill:#e6e8dc;stroke:#697b69;stroke-width:2}.overlay{fill:#d8e8d5;stroke:#39724e;stroke-width:2}</style><g transform="translate(0,0)"><text class="title" x="24" y="42">Fit Check</text><rect x="24" y="65" width="312" height="275" fill="white" stroke="#c4c8b9"/><path class="scene" d="M50 300V110H300V300Z"/><rect class="overlay" x="95" y="150" width="135" height="150"/><path d="M95 200H230M95 250H230" stroke="#39724e"/><text class="label" x="90" y="132">90 cm · scale checked</text><rect class="scene" x="260" y="140" width="40" height="160"/><text class="label" x="24" y="375">Compare size before buying.</text></g><g transform="translate(360,0)"><text class="title" x="24" y="42">Sort Along</text><rect x="24" y="65" width="312" height="275" fill="white" stroke="#c4c8b9"/><path class="scene" d="M65 160L110 125L150 145L190 125L235 160L210 195L190 180V290H110V180L90 195Z"/><rect class="overlay" x="170" y="215" width="145" height="65"/><text class="label" x="180" y="240">Gentle wash</text><text class="small" x="180" y="262">Check original label</text><text class="label" x="24" y="375">Read the label beside the item.</text></g><g transform="translate(720,0)"><text class="title" x="24" y="42">Last Seen</text><rect x="24" y="65" width="312" height="275" fill="white" stroke="#c4c8b9"/><rect class="scene" x="50" y="180" width="250" height="100"/><circle cx="130" cy="215" r="16" fill="none" stroke="#a77434" stroke-width="4"/><path d="M145 215H185M175 215V230" stroke="#a77434" stroke-width="4"/><rect class="overlay" x="65" y="95" width="230" height="65"/><text class="label" x="80" y="120">Keys · desk drawer</text><text class="small" x="80" y="144">Saved 20 min ago</text><text class="label" x="24" y="375">Separate a memory from live tracking.</text></g><text class="small" x="24" y="430">Original concept sketches. Scenes, labels and dimensions are illustrative.</text></svg>